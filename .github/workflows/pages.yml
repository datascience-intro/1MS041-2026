name: Build and deploy course site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-jupyterlite.txt
            requirements-pyodide.txt

      - name: Install JupyterLite build dependencies
        run: python -m pip install -r requirements-jupyterlite.txt

      - name: Build JupyterLite from notebooks
        run: jupyter lite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll course site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify assembled site
        run: |
          test -f _site/index.html
          test -f _site/lite/lab/index.html
          test -f _site/lite/jupyter-lite.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
